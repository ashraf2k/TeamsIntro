<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teams for Teachers</title>
<meta name="description" content="A quick bilingual (English / Arabic) guide for teachers to schedule, start and control Microsoft Teams meetings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5fb; --surface:#ffffff; --surface-2:#efedf8; --ink:#1d1b2e; --muted:#5d5a73;
  --line:#dddaec; --accent:#4f46b8; --accent-ink:#ffffff; --accent-soft:#e6e3fa;
  --ok:#1f7a4d; --ok-soft:#dff3e8; --warn:#9a5b00; --warn-soft:#fdf0d8;
  --shadow:0 1px 2px rgba(20,16,60,.06),0 6px 20px rgba(20,16,60,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14131c; --surface:#1d1c28; --surface-2:#262535; --ink:#ecebf5; --muted:#a9a6c0;
    --line:#34324a; --accent:#a39cff; --accent-ink:#14131c; --accent-soft:#2c2950;
    --ok:#6fd3a0; --ok-soft:#1b3328; --warn:#f2bf63; --warn-soft:#3a2e15;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#14131c; --surface:#1d1c28; --surface-2:#262535; --ink:#ecebf5; --muted:#a9a6c0;
  --line:#34324a; --accent:#a39cff; --accent-ink:#14131c; --accent-soft:#2c2950;
  --ok:#6fd3a0; --ok-soft:#1b3328; --warn:#f2bf63; --warn-soft:#3a2e15;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.65}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--ink);margin-inline-end:auto}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.95rem}
.tbtn:hover{border-color:var(--accent)}
.tbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.menu-btn{display:none}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px}
nav.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);overflow:auto;padding:20px 0}
nav.side ol{list-style:none;margin:0;padding:0;counter-reset:s}
nav.side li a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:.95rem}
nav.side li a:hover{background:var(--surface-2);color:var(--ink)}
nav.side li a.active{background:var(--accent-soft);color:var(--ink);font-weight:600}
nav.side .num{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;background:var(--surface)}
nav.side li a.done .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.progress{margin:0 10px 16px;font-size:.85rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}

main{padding:28px 0 80px;min-width:0}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow);margin-bottom:28px}
.hero h1{font-size:clamp(1.6rem,3.5vw,2.3rem);line-height:1.25;margin:0 0 10px}
.hero p{margin:0 0 18px;color:var(--muted);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.88rem}
.search{margin-top:20px;display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}

section.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow)}
.topic-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.topic-ico{flex:0 0 46px;height:46px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:1.4rem}
.topic h2{margin:0;font-size:1.35rem;line-height:1.35}
.topic .lead{margin:2px 0 0;color:var(--muted)}
.topic h3{font-size:1.05rem;margin:22px 0 10px}
ol.steps{list-style:none;padding:0;margin:10px 0 0;counter-reset:st}
ol.steps li{counter-increment:st;position:relative;padding-inline-start:46px;margin-bottom:14px}
ol.steps li::before{content:counter(st);position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
kbd,.ui{font-family:inherit;background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:.9em;font-weight:600;white-space:nowrap}
.note{border-radius:12px;padding:12px 16px;margin:16px 0 0;display:flex;gap:10px}
.note.tip{background:var(--ok-soft)}
.note.warn{background:var(--warn-soft)}
.note b{white-space:nowrap}

table.ctrl{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}
table.ctrl th,table.ctrl td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:start;vertical-align:top}
table.ctrl th{color:var(--muted);font-weight:600;font-size:.85rem}
.scroll-x{overflow-x:auto}

.done-row{display:flex;justify-content:flex-end;margin-top:18px}
.done-btn{border:1px solid var(--line);background:var(--bg);padding:8px 16px;border-radius:999px;cursor:pointer}
.done-btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}

/* Mock UI illustration */
.mock{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mock span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.mock span.hot{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.mock span.end{background:#c4314b;color:#fff;border-color:#c4314b}

.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:12px}
.cheat div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.cheat b{display:block;margin-bottom:4px}

details.faq{border-bottom:1px solid var(--line);padding:12px 0}
details.faq summary{cursor:pointer;font-weight:600}
details.faq p{margin:8px 0 0;color:var(--muted)}

.empty{display:none;text-align:center;color:var(--muted);padding:40px}
footer{color:var(--muted);font-size:.85rem;text-align:center;padding:24px 16px 40px}


/* Annotated screenshots */
figure.shot{margin:18px 0 6px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px}
.shot-frame{position:relative;direction:ltr;cursor:zoom-in;border-radius:8px;overflow:hidden;line-height:0}
.shot-frame img{width:100%;height:auto;display:block}
.mark{position:absolute;transform:translate(-50%,-50%);width:clamp(20px,3.4vw,30px);height:clamp(20px,3.4vw,30px);border-radius:50%;
  background:#e8384f;color:#fff;font-weight:700;font-size:clamp(.7rem,1.6vw,.9rem);line-height:1;display:grid;place-items:center;
  border:2px solid #fff;box-shadow:0 0 0 3px rgba(232,56,79,.35),0 2px 6px rgba(0,0,0,.4);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(232,56,79,.35),0 2px 6px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 8px rgba(232,56,79,.12),0 2px 6px rgba(0,0,0,.4)}}
@media (prefers-reduced-motion:reduce){.mark{animation:none}}
ol.legend{list-style:none;margin:12px 4px 4px;padding:0;display:grid;gap:8px}
ol.legend li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
ol.legend .n{flex:0 0 24px;height:24px;border-radius:50%;background:#e8384f;color:#fff;font-weight:700;font-size:.8rem;display:grid;place-items:center;margin-top:2px}
figcaption{font-size:.75rem;color:var(--muted);margin:8px 4px 0}
figcaption a{color:var(--muted)}
.shot-frame.zoom{position:fixed;inset:0;z-index:100;background:rgba(10,10,20,.92);display:grid;place-items:center;cursor:zoom-out;border-radius:0;padding:16px}
.shot-frame.zoom .zin{position:relative;width:min(1400px,100%)}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav.side{position:fixed;inset-block:62px 0;inset-inline-start:0;width:min(300px,86vw);max-height:none;background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 10px;transform:translateX(-105%);transition:transform .25s;z-index:30}
  [dir="rtl"] nav.side{transform:translateX(105%)}
  nav.side.open{transform:none!important;box-shadow:var(--shadow)}
  .menu-btn{display:inline-flex}
  .hero{padding:22px}
  section.topic{padding:20px 16px}
  .brand .full{display:none}
}
@media print{
  header.top,nav.side,.done-row,.search{display:none!important}
  .wrap{display:block}
  section.topic{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <button class="tbtn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    <a class="brand" href="#top"><span class="brand-mark">T</span><span class="full" data-i18n="brand"></span></a>
    <button class="tbtn" id="themeBtn" aria-label="Theme">🌓</button>
    <button class="tbtn primary" id="langBtn" aria-label="Language"></button>
  </div>
</header>

<div class="wrap" id="top">
  <nav class="side" id="side" aria-label="Topics">
    <div class="progress"><span id="progText"></span><div class="bar"><i id="progBar"></i></div></div>
    <ol id="toc"></ol>
  </nav>
  <main>
    <div class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroText"></p>
      <div class="chips" id="chips"></div>
      <div class="search"><input id="search" type="search" autocomplete="off"></div>
    </div>
    <div id="content"></div>
    <div class="empty" id="empty" data-i18n="noResults"></div>
  </main>
</div>
<footer data-i18n="footer"></footer>

<script>
/* ---------- Content (English + Arabic) ---------- */
const UI = {
  en:{brand:"Teams for Teachers",heroTitle:"Microsoft Teams for teachers — the essentials",
      heroText:"Short, step-by-step lessons to schedule a class, start it, and stay in control of students' microphones, cameras and chat. Follow the topics in order or jump to what you need.",

      progress:(d,t)=>`${d} of ${t} topics done`,markDone:"Mark as done ✓",done:"Done ✓",

      footer:"An independent learning guide for teachers. Menu names can differ slightly between Teams versions and your school's settings. Microsoft Teams is a trademark of Microsoft."},
  ar:{brand:"Teams للمعلمين",heroTitle:"مايكروسوفت تيمز للمعلمين — الأساسيات",
      heroText:"دروس قصيرة خطوة بخطوة لجدولة الحصة وبدئها والتحكم في ميكروفونات الطلاب وكاميراتهم والدردشة. اتبع الموضوعات بالترتيب أو انتقل مباشرة إلى ما تحتاجه.",
      chips:["⏱ حوالي ١٥ دقيقة","🖥 تطبيق سطح المكتب والويب","📱 يعمل على الجوال أيضاً"],
      search:"ابحث… مثلاً: كتم، كاميرا، دردشة، تسجيل",noResults:"لا يوجد موضوع يطابق بحثك.",

};

/* Each topic: id, icon, title, lead, blocks[] ; blocks: {h}, {steps:[]}, {tip}, {warn}, {mock:[]}, {table:{head,rows}}, {cheat:[[t,d]]}, {faq:[[q,a]]}, {p} */
const TOPICS = [
{ id:"start", icon:"👋",
  en:{title:"1. Get started",lead:"Sign in and learn the four buttons you will use most.",blocks:[
    {steps:[
      "Open the Teams desktop app, or go to <b>teams.microsoft.com</b> in Chrome or Edge.",

    {tip:"Use the <b>desktop app</b> for teaching. It gives you all meeting controls; some options are limited in the browser and on phones."}

    {steps:[
      "افتح تطبيق تيمز على الحاسوب، أو ادخل إلى <b>teams.microsoft.com</b> من متصفح Chrome أو Edge.",
      "سجّل الدخول <b>ببريد المدرسة وكلمة المرور</b> التي زودتك بها المدرسة (وليس حساباً شخصياً).",
      "انظر إلى الشريط الموجود على جانب الشاشة. هذه هي الأماكن الأكثر استخداماً:"]},
    {cheat:[["🔔 النشاط (Activity)","الإشارات والردود والإشعارات."],["💬 الدردشة (Chat)","الرسائل الخاصة والجماعية."],["👥 الفرق (Teams)","فرق الفصول وقنواتها."],["📅 التقويم (Calendar)","جدولة الاجتماعات والانضمام إليها وإدارتها."]]},

    {tip:"استخدم <b>تطبيق سطح المكتب</b> عند التدريس، فهو يوفر جميع أدوات التحكم في الاجتماع، بينما تكون بعض الخيارات محدودة في المتصفح والجوال."}
  ]}
},
{ id:"schedule", icon:"📅",
  en:{title:"2. Schedule a class meeting",lead:"Create the meeting in advance so students can find it and join on time.",blocks:[
    {h:"Option A — from the Calendar"},
    {steps:[
      "Click <span class='ui'>Calendar</span> on the left.",
      "Click <span class='ui'>+ New meeting</span> (top corner).",
      "Type a <b>title</b>, e.g. “Grade 8 Science – Lesson 4”.",
      "Under <b>Add required attendees</b>, type student names or a class group.",
      "Choose the <b>date, start and end time</b>. For weekly lessons, set <span class='ui'>Does not repeat</span> to <b>Weekly</b>.",

    {shot:"newbtn"},{shot:"form"},
    {h:"Option B — from your class team"},
    {steps:[
      "Open <span class='ui'>Teams</span> and select your class team.",
      "In the channel, click the arrow next to <span class='ui'>Meet</span> and choose <span class='ui'>Schedule a meeting</span>.",
      "Fill in the details and click <span class='ui'>Send</span>. Everyone in the team can see and join it from the channel."]},
    {tip:"Before saving, open <b>Meeting options</b> (topic 4) and set students to <b>attendees</b>. This is the key to staying in control."}
  ]},
  ar:{title:"٢. جدولة اجتماع للحصة",lead:"أنشئ الاجتماع مسبقاً ليتمكن الطلاب من إيجاده والانضمام في الوقت المحدد.",blocks:[

    {shot:"newbtn"},{shot:"form"},
    {h:"الطريقة الثانية — من فريق الفصل"},
    {steps:[

    {tip:"قبل الحفظ، افتح <b>خيارات الاجتماع</b> (الموضوع ٤) واجعل الطلاب <b>حضوراً (attendees)</b>؛ فهذا هو مفتاح التحكم في الحصة."}

{ id:"join", icon:"▶️",
  en:{title:"3. Start or join a meeting",lead:"Start a scheduled class, or open an instant one.",blocks:[

  ar:{title:"٣. بدء الاجتماع أو الانضمام إليه",lead:"ابدأ حصة مجدولة أو افتح اجتماعاً فورياً.",blocks:[
    {h:"بدء حصة مجدولة"},
    {steps:[

{ id:"options", icon:"⚙️",
  en:{title:"4. Meeting options: control the class",lead:"One page that decides who can talk, show video, present and chat.",blocks:[
    {h:"Open Meeting options"},
    {steps:[
      "<b>Before class:</b> open the meeting in <span class='ui'>Calendar</span> → <span class='ui'>Edit</span> → <span class='ui'>Meeting options</span>.",
      "<b>During class:</b> click <span class='ui'>••• More</span> → <span class='ui'>Settings</span> → <span class='ui'>Meeting options</span>.",
      "Change the settings below, then click <span class='ui'>Save</span>."]},
    {shot:"options"},
    {h:"Recommended settings for a class"},
    {table:{head:["Setting","Recommended choice","Why"],rows:[
      ["Who can bypass the lobby?","People in my organization (or Only me)","Outsiders wait for you to admit them."],
      ["Who can present?","Only me and co-organizers","Students become <b>attendees</b> and cannot share screen, mute others or remove people."],
      ["Allow mic for attendees","Off at the start, turn On when needed","Prevents background noise; students can't unmute."],
      ["Allow camera for attendees","On or Off as your school requires","Controls whether students can turn on video."],
      ["Meeting chat","On / In-meeting only / Off","“In-meeting only” stops chat before and after class."],
      ["Allow reactions","On","Lets students respond with emoji quietly."]]}},
    {warn:"Mic and camera controls work only for <b>attendees</b>. If “Who can present” is set to Everyone, students are presenters and these switches will not affect them."}
  ]},
  ar:{title:"٤. خيارات الاجتماع: التحكم في الحصة",lead:"صفحة واحدة تحدد من يتحدث ومن يفتح الكاميرا ومن يعرض ومن يكتب في الدردشة.",blocks:[
    {h:"فتح خيارات الاجتماع"},
    {steps:[
      "<b>قبل الحصة:</b> افتح الاجتماع من <span class='ui'>التقويم</span> ← <span class='ui'>تحرير</span> ← <span class='ui'>خيارات الاجتماع (Meeting options)</span>.",
      "<b>أثناء الحصة:</b> اضغط <span class='ui'>••• المزيد</span> ← <span class='ui'>الإعدادات</span> ← <span class='ui'>خيارات الاجتماع</span>.",
      "غيّر الإعدادات التالية ثم اضغط <span class='ui'>حفظ</span>."]},
    {shot:"options"},
    {h:"الإعدادات المقترحة للحصة"},
    {table:{head:["الإعداد","الاختيار المقترح","السبب"],rows:[
      ["من يمكنه تجاوز الردهة؟","الأشخاص في مؤسستي (أو أنا فقط)","ينتظر الغرباء حتى تسمح لهم بالدخول."],
      ["من يمكنه العرض؟","أنا والمنظمون المشاركون فقط","يصبح الطلاب <b>حضوراً</b> فلا يستطيعون مشاركة الشاشة أو كتم الآخرين أو إخراجهم."],
      ["السماح بالميكروفون للحضور","مغلق في البداية، وافتحه عند الحاجة","يمنع الضوضاء، ولا يستطيع الطلاب إلغاء الكتم."],
      ["السماح بالكاميرا للحضور","مفتوح أو مغلق حسب سياسة المدرسة","يتحكم في قدرة الطلاب على تشغيل الفيديو."],
      ["دردشة الاجتماع","تشغيل / أثناء الاجتماع فقط / إيقاف","خيار «أثناء الاجتماع فقط» يمنع الدردشة قبل الحصة وبعدها."],
      ["السماح بالتفاعلات","تشغيل","يتيح للطلاب التفاعل بالرموز بهدوء."]]}},
    {warn:"أدوات التحكم في الميكروفون والكاميرا تعمل على <b>الحضور (attendees)</b> فقط. إذا كان «من يمكنه العرض» = الجميع، فسيكون الطلاب مقدّمين ولن تؤثر عليهم هذه الإعدادات."}
  ]}
},
{ id:"live", icon:"🎙",
  en:{title:"5. Mics & cameras during class",lead:"Mute everyone, lock mics and cameras, or allow one student to speak.",blocks:[
    {h:"For the whole class"},
    {steps:[
      "Click <span class='ui'>People</span> in the toolbar.",
      "Click <span class='ui'>Mute all</span> to mute everyone once (students can unmute themselves again).",
      "To <b>lock</b> mics: click <span class='ui'>•••</span> next to <b>Participants</b> → <span class='ui'>Disable mic for attendees</span>.",
      "To lock cameras: same menu → <span class='ui'>Disable camera for attendees</span>.",
      "To give everyone permission back, choose <span class='ui'>Allow mic for attendees</span> / <span class='ui'>Allow camera for attendees</span>."]},
    {shot:"people"},
    {h:"For one student"},
    {steps:[
      "In <span class='ui'>People</span>, point to the student's name and click <span class='ui'>•••</span>.",
      "Choose <span class='ui'>Allow mic</span> to let only this student speak (e.g. when they raise their hand), or <span class='ui'>Disable mic</span> / <span class='ui'>Disable camera</span>.",
      "Other useful items here: <span class='ui'>Mute participant</span>, <span class='ui'>Spotlight</span> (show their video to everyone) and <span class='ui'>Remove from meeting</span>."]},
    {h:"Raised hands"},
    {p:"Students click <span class='ui'>✋ Raise</span>. Their names appear in order at the top of the People list. After they speak, use <span class='ui'>Lower all hands</span>."},
    {tip:"A smooth routine: lock all mics → student raises hand → <b>Allow mic</b> for that student → <b>Disable mic</b> again when finished."}
  ]},
  ar:{title:"٥. الميكروفونات والكاميرات أثناء الحصة",lead:"اكتم الجميع، أو اقفل الميكروفونات والكاميرات، أو اسمح لطالب واحد بالتحدث.",blocks:[
    {h:"لجميع الطلاب"},
    {steps:[
      "اضغط <span class='ui'>الأشخاص (People)</span> في شريط الأدوات.",
      "اضغط <span class='ui'>كتم الكل (Mute all)</span> لكتم الجميع مرة واحدة (يمكن للطلاب إلغاء الكتم بعدها).",
      "<b>لقفل</b> الميكروفونات: اضغط <span class='ui'>•••</span> بجانب <b>المشاركين</b> ← <span class='ui'>تعطيل الميكروفون للحضور</span>.",
      "لقفل الكاميرات: من نفس القائمة ← <span class='ui'>تعطيل الكاميرا للحضور</span>.",
      "لإعادة السماح للجميع اختر <span class='ui'>السماح بالميكروفون للحضور</span> / <span class='ui'>السماح بالكاميرا للحضور</span>."]},
    {shot:"people"},
    {h:"لطالب واحد"},
    {steps:[
      "في قائمة <span class='ui'>الأشخاص</span>، مرّر المؤشر على اسم الطالب واضغط <span class='ui'>•••</span>.",
      "اختر <span class='ui'>السماح بالميكروفون</span> ليتحدث هذا الطالب فقط (مثلاً عند رفع يده)، أو <span class='ui'>تعطيل الميكروفون</span> / <span class='ui'>تعطيل الكاميرا</span>.",
      "خيارات مفيدة أخرى: <span class='ui'>كتم المشارك</span>، و<span class='ui'>تسليط الضوء (Spotlight)</span> لعرض الفيديو الخاص به للجميع، و<span class='ui'>إزالة من الاجتماع</span>."]},
    {h:"رفع اليد"},
    {p:"يضغط الطالب <span class='ui'>✋ رفع اليد</span>، فيظهر اسمه بالترتيب في أعلى قائمة الأشخاص. بعد أن يتحدث استخدم <span class='ui'>خفض جميع الأيدي</span>."},
    {tip:"روتين سهل: اقفل جميع الميكروفونات ← يرفع الطالب يده ← <b>السماح بالميكروفون</b> له ← <b>تعطيل الميكروفون</b> مرة أخرى بعد انتهائه."}
  ]}
},
{ id:"chat", icon:"💬",

    {warn:"Turning chat off also stops your own messages to students. Use <b>In-meeting only</b> if you just want to prevent chatting outside class time."}

  ar:{title:"٦. التحكم في دردشة الاجتماع",lead:"اجعل الدردشة مفيدة، أو أوقفها عندما تحتاج إلى التركيز.",blocks:[
    {steps:[

      "ابحث عن <b>دردشة الاجتماع</b> واختر: <b>تشغيل</b> (دائماً)، أو <b>أثناء الاجتماع فقط</b>، أو <b>إيقاف</b>.",

    {shot:"chat"},
    {tip:"ثبّت الرسائل المهمة (الواجبات والروابط) في الدردشة: مرّر المؤشر على الرسالة ← <span class='ui'>•••</span> ← <span class='ui'>تثبيت</span>."},
    {warn:"إيقاف الدردشة يمنع رسائلك أنت أيضاً. استخدم <b>أثناء الاجتماع فقط</b> إذا أردت منع الدردشة خارج وقت الحصة فقط."}
  ]}
},

      ["طالب يلغي الكتم باستمرار.","«كتم الكل» مؤقت. استخدم «تعطيل الميكروفون للحضور» لقفل الميكروفونات."],
      ["الطلاب يستطيعون مشاركة الشاشة.","هم مقدّمون. اجعل «من يمكنه العرض» = «أنا والمنظمون المشاركون فقط»."],
      ["الطلاب لا يسمعونني.","تأكد أن الميكروفون غير مكتوم وأن الجهاز الصحيح مختار: ••• المزيد ← الإعدادات ← إعدادات الجهاز."],

    en:["<b>Leave</b> – as the organizer, click the small arrow next to it and choose <b>End meeting</b>"],
    ar:["<b>مغادرة</b> – بصفتك المنظم اضغط السهم الصغير بجانبه واختر <b>إنهاء الاجتماع</b>"]}

const CREDIT = {en:"Screenshot: Microsoft, from Microsoft Learn documentation, licensed CC BY 4.0. Numbered markers added. Your Teams may look slightly different.",
                ar:"لقطة شاشة: مايكروسوفت، من وثائق Microsoft Learn، برخصة CC BY 4.0، مع إضافة العلامات المرقمة. قد يختلف شكل تيمز لديك قليلاً."};
function shot(key){
  const s = SHOTS[key], im = IMG[s.img], L = s[lang];
  const nums = n => lang==="ar" ? n.toLocaleString("ar-EG") : n;
  return `<figure class="shot">
    <div class="shot-frame" role="button" tabindex="0" aria-label="${lang==="ar"?"تكبير الصورة":"Enlarge screenshot"}"><div class="zin">
      <img src="${im.src}" width="${im.w}" height="${im.h}" loading="lazy" alt="${L.map(x=>x.replace(/<[^>]+>/g,"")).join(" · ")}">
      ${s.marks.map((m,i)=>`<span class="mark" style="left:${m[0]}%;top:${m[1]}%" aria-hidden="true">${nums(i+1)}</span>`).join("")}
    </div></div>
    <ol class="legend">${L.map((x,i)=>`<li><span class="n">${nums(i+1)}</span><span>${x}</span></li>`).join("")}</ol>
    <figcaption>${CREDIT[lang]} <a href="${SRC}" target="_blank" rel="noopener">Source</a></figcaption>
  </figure>`;
}

/* ---------- Rendering ---------- */
const $ = s => document.querySelector(s);
const store = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
               set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang = store.get("lang", (navigator.language||"").startsWith("ar") ? "ar" : "en");
let done = store.get("done", []);

function block(b,t){
  if(b.h) return `<h3>${b.h}</h3>`;
  if(b.p) return `<p>${b.p}</p>`;
  if(b.steps) return `<ol class="steps">${b.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`;
  if(b.tip) return `<div class="note tip"><b>💡 ${t.tip}:</b><span>${b.tip}</span></div>`;
  if(b.warn) return `<div class="note warn"><b>⚠️ ${t.warn}:</b><span>${b.warn}</span></div>`;
  if(b.mock) return `<div class="mock" aria-hidden="true">${b.mock.map(m=>typeof m==="string"?`<span>${m}</span>`:`<span class="${m.c}">${m.t}</span>`).join("")}</div>`;
  if(b.cheat) return `<div class="cheat">${b.cheat.map(([a,d])=>`<div><b>${a}</b>${d}</div>`).join("")}</div>`;
  if(b.table) return `<div class="scroll-x"><table class="ctrl"><thead><tr>${b.table.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<b>${c}</b>`:c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(b.faq) return b.faq.map(([q,a])=>`<details class="faq"><summary>${q}</summary><p>${a}</p></details>`).join("");
  if(b.shot) return shot(b.shot);
  return "";
}

function render(){
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = t.brand;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.innerHTML=t[el.dataset.i18n]);
  $("#langBtn").textContent = "🌐 " + t.lang;
  $("#search").placeholder = t.search;
  $("#chips").innerHTML = t.chips.map(c=>`<span class="chip">${c}</span>`).join("");
  $("#content").innerHTML = TOPICS.map(tp=>{
    const c = tp[lang], isDone = done.includes(tp.id);
    return `<section class="topic" id="${tp.id}">
      <div class="topic-head"><div class="topic-ico" aria-hidden="true">${tp.icon}</div>
      <div><h2>${c.title}</h2><p class="lead">${c.lead}</p></div></div>
      ${c.blocks.map(b=>block(b,t)).join("")}
      <div class="done-row"><button class="done-btn" data-id="${tp.id}" aria-pressed="${isDone}">${isDone?t.done:t.markDone}</button></div>
    </section>`;}).join("");
  $("#toc").innerHTML = TOPICS.map((tp,i)=>`<li><a href="#${tp.id}" data-id="${tp.id}" class="${done.includes(tp.id)?"done":""}"><span class="num">${done.includes(tp.id)?"✓":(i<10?(lang==="ar"?(i+1).toLocaleString("ar-EG"):i+1):"?")}</span><span>${tp[lang].title.replace(/^[\d١-٩٠]+\.\s*/,"")}</span></a></li>`).join("");
  progress(); filter(); observe();
}
function progress(){
  const n = done.filter(id=>TOPICS.some(t=>t.id===id)).length;
  $("#progText").textContent = UI[lang].progress(n, TOPICS.length);
  $("#progBar").style.width = (n/TOPICS.length*100)+"%";
}
function filter(){
  const q = $("#search").value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("section.topic").forEach(s=>{
    const tp = TOPICS.find(t=>t.id===s.id);
    const hay = (JSON.stringify(tp.en)+JSON.stringify(tp.ar)).toLowerCase();
    const ok = !q || hay.includes(q);
    s.style.display = ok ? "" : "none"; if(ok) shown++;
    if(ok && q) s.querySelectorAll("details").forEach(d=>d.open=true);
  });
  $("#empty").style.display = shown ? "none" : "block";
}
let io;
function observe(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll("#toc a").forEach(a=>a.classList.toggle("active",a.dataset.id===e.target.id));}}),
    {rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll("section.topic").forEach(s=>io.observe(s));
}

/* ---------- Events ---------- */
$("#langBtn").onclick = ()=>{ lang = lang==="en"?"ar":"en"; store.set("lang",lang); render(); };
$("#search").oninput = filter;
$("#content").onclick = e=>{
  const b = e.target.closest(".done-btn"); if(!b) return;
  const id = b.dataset.id;
  done = done.includes(id) ? done.filter(x=>x!==id) : [...done,id];
  store.set("done",done); render();
};
$("#menuBtn").onclick = ()=>$("#side").classList.toggle("open");
$("#toc").onclick = e=>{ if(e.target.closest("a")) $("#side").classList.remove("open"); };
const themes = ["auto","light","dark"];
let theme = store.get("theme","auto");
function applyTheme(){ if(theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = theme;
  $("#themeBtn").textContent = {auto:"🌓",light:"☀️",dark:"🌙"}[theme]; }
$("#themeBtn").onclick = ()=>{ theme = themes[(themes.indexOf(theme)+1)%3]; store.set("theme",theme); applyTheme(); };
document.addEventListener("click", e=>{
  const f = e.target.closest(".shot-frame"); if(!f) return;
  f.classList.toggle("zoom"); document.body.style.overflow = f.classList.contains("zoom") ? "hidden" : "";
});
document.addEventListener("keydown", e=>{
  const z = document.querySelector(".shot-frame.zoom");
  if(e.key==="Escape" && z){ z.classList.remove("zoom"); document.body.style.overflow=""; }
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("shot-frame")) e.target.click();
});
applyTheme(); render();
</script>
</body>
